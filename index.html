<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TJ AI PDF Editor</title>
  <meta name="description" content="A free, private, fully in-browser PDF editor with a Word-style ribbon. Edit, format, annotate, organize, convert and secure PDFs — nothing leaves your device." />
  <meta name="author" content="Md. Rafiul Hoque Fakir" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Tiro+Bangla:ital@0;1&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
  <!-- Bangladesh Bengali fonts (SolaimanLipi, Kalpurush) -->
  <link rel="stylesheet" href="https://fonts.maateen.me/solaiman-lipi/font.css" />
  <link rel="stylesheet" href="https://fonts.maateen.me/kalpurush/font.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ============ App bar ============ -->
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V7h3.5L13 3.5z"/><path fill="#fff" d="M7.5 12.5h2.2c1.2 0 2 .7 2 1.8s-.8 1.8-2 1.8H8.4v1.6H7.5v-5.2zm.9.8v2h.9c.6 0 1-.4 1-1s-.4-1-1-1h-.9z"/></svg>
      </div>
      <div class="brand-text">
        <strong>TJ AI PDF Editor</strong>
        <span id="docName">100% in your browser · private</span>
      </div>
    </div>

    <div class="appbar-actions" id="docActions" hidden>
      <button class="btn ghost ripple" id="btnUndo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" class="ic"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span>Undo</span>
      </button>
      <button class="btn ghost ripple" id="btnRedo" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" class="ic"><path fill="currentColor" d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><span>Redo</span>
      </button>
      <div class="sep"></div>
      <button class="btn primary ripple" id="btnSave" title="Save / Download (Ctrl+S)">
        <svg viewBox="0 0 24 24" class="ic"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg><span>Save as</span>
      </button>
      <div class="kebab-wrap">
        <button class="btn ghost icon-only ripple" id="btnMore" title="More">
          <svg viewBox="0 0 24 24" class="ic"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        </button>
        <div class="menu pop" id="moreMenu" hidden>
          <button data-export="save">Save / Download…</button>
          <div class="menu-sep"></div>
          <button data-export="close">Close document</button>
        </div>
      </div>
      <button class="btn ai-btn ripple" id="btnAI" title="AI Assistant — create & edit PDFs with AI">
        <svg viewBox="0 0 24 24" class="ic"><path fill="currentColor" d="M12 2l1.8 4.6L18.4 8l-4.6 1.8L12 14l-1.8-4.2L5.6 8l4.6-1.4zM18 13l1 2.6 2.6 1-2.6 1L18 20l-1-2.4-2.6-1 2.6-1zM6 14l.9 2.1L9 17l-2.1.9L6 20l-.9-2.1L3 17l2.1-.9z"/></svg>
        <span>Assistant</span>
      </button>
      <button class="btn ghost icon-only ripple" id="btnTheme" title="Toggle light / dark">
        <svg viewBox="0 0 24 24" class="ic" id="themeIcon"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0 1 12 3z"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ Word-style ribbon ============ -->
  <div class="ribbon" id="ribbon" hidden>
    <div class="ribbon-tabs" id="ribbonTabs"></div>
    <div class="ribbon-body" id="ribbonBody"></div>
  </div>

  <!-- ============ Main layout ============ -->
  <div class="layout">
    <main class="workspace" id="workspace">
      <section class="dropzone" id="dropzone">
        <div class="dz-inner">
          <div class="dz-icon"><svg viewBox="0 0 24 24" width="64" height="64"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></div>
          <h1>Drop a PDF or images here</h1>
          <p>Everything happens locally in your browser. Your files never get uploaded.</p>
          <div class="dz-actions">
            <button class="btn primary lg ripple" id="btnOpen">Open file</button>
            <button class="btn ghost lg ripple" id="btnBlank">Create blank PDF</button>
          </div>
          <p class="dz-hint">Supports PDF, PNG, JPG, WebP · or paste an image with Ctrl+V</p>
        </div>
      </section>
      <div class="pageviewport" id="pageviewport" hidden></div>
    </main>

    <aside class="sidepanel" id="sidepanel" hidden>
      <div class="side-head">
        <span id="sideTitle">Pages</span>
        <button class="btn ghost icon-only sm" id="sideClose" title="Close panel">
          <svg viewBox="0 0 24 24" class="ic"><path fill="currentColor" d="M18.3 5.71L12 12l6.3 6.29-1.42 1.42L10.59 13.4 4.3 19.7 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z"/></svg>
        </button>
      </div>
      <div class="side-body" id="sideBody"></div>
    </aside>
  </div>

  <footer class="statusbar" id="statusbar" hidden>
    <div class="status-left" id="statusInfo">No document</div>
    <div class="status-right">
      <button class="btn ghost icon-only sm" id="zoomOut" title="Zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button class="btn ghost icon-only sm" id="zoomIn" title="Zoom in">+</button>
      <button class="btn ghost sm" id="zoomFit" title="Fit width">Fit</button>
    </div>
  </footer>

  <input type="file" id="fileInput" accept="application/pdf,image/*,.json,application/json" multiple hidden />
  <input type="file" id="imageInput" accept="image/*" hidden />

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-host" id="modalHost" hidden></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyMsg">Working…</span></div>

  <!-- ============ Libraries ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/@cantoo/pdf-lib@2.5.0/dist/pdf-lib.min.js"></script>
  <script>window.PDFLibEnc = window.PDFLib || null; window.PDFLib = undefined;</script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

  <!-- ============ App ============ -->
  <!-- Local modules are loaded in dependency order with a per-load cache-buster,
       so the browser never serves a stale .js after an edit. -->
  <script>
    (function () {
      var v = Date.now();
      var files = ['libs', 'state', 'util', 'fonts', 'avro', 'suggest', 'keyboard', 'loader',
        'viewer', 'annotate', 'textedit', 'pages', 'operations', 'export', 'saveas', 'ocr',
        'format', 'ribbon', 'ui', 'ai', 'chat', 'main'];
      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = 'js/' + files[i] + '.js?v=' + v;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { console.error('Failed to load', s.src); next(i + 1); };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
